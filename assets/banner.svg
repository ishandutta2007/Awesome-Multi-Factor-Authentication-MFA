<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.4; }
    .pulse-ring {
      animation: pulseAnim 4s ease-in-out infinite;
      transform-origin: 1050px 180px;
    }
    .orbit-dot-1 {
      animation: orbitAnim1 8s linear infinite;
      transform-origin: 1050px 180px;
    }
    .orbit-dot-2 {
      animation: orbitAnim2 12s linear infinite;
      transform-origin: 1050px 180px;
    }
    .stream-beam {
      stroke-dasharray: 8 16;
      animation: beamFlow 3s linear infinite;
    }
    .pulse-dot {
      animation: blink 2.5s ease-in-out infinite alternate;
    }
    @keyframes pulseAnim {
      0%, 100% { transform: scale(0.96); opacity: 0.35; }
      50% { transform: scale(1.04); opacity: 0.8; }
    }
    @keyframes orbitAnim1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitAnim2 {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes beamFlow {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Background Animated Cyber Grid Lines -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Security Data Streams (Background layer, well clear of text) -->
  <path d="M 680 80 Q 850 40 1050 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" class="stream-beam" />
  <path d="M 720 300 Q 880 320 1050 180" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4" class="stream-beam" />
  <path d="M 800 180 L 1050 180" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.5" class="stream-beam" />

  <!-- Dynamic MFA Holographic Node on the Right -->
  <g id="dynamic-node">
    <!-- Concentric radar pulse rings -->
    <circle cx="1050" cy="180" r="110" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 6" class="pulse-ring" />
    <circle cx="1050" cy="180" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" class="pulse-ring" style="animation-duration: 6s;" />
    <circle cx="1050" cy="180" r="60" fill="url(#shieldGrad)" filter="url(#subtleGlow)" />

    <!-- Orbital elements revolving around the auth core -->
    <g class="orbit-dot-1">
      <circle cx="1050" cy="95" r="7" fill="#38bdf8" filter="url(#glow)" />
      <!-- TOTP Key Icon Token -->
      <rect x="1042" y="87" width="16" height="16" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="1050" cy="95" r="3" fill="#38bdf8" />
    </g>

    <g class="orbit-dot-2">
      <circle cx="1050" cy="265" r="7" fill="#a855f7" filter="url(#glow)" />
      <!-- FIDO Passkey Token -->
      <rect x="1042" y="257" width="16" height="16" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="1050" cy="265" r="3" fill="#a855f7" />
    </g>

    <!-- Center Security Shield Graphic -->
    <path d="M 1050 148 L 1076 160 C 1076 186 1064 204 1050 214 C 1036 204 1024 186 1024 160 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)" />
    <!-- Checkmark inside Shield -->
    <path d="M 1042 178 L 1047 184 L 1059 171" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Content Block (Left to Center-Right: Guaranteed Clear and Readable) -->
  <g id="foreground-content" transform="translate(60, 0)">
    <!-- Top Cyber Badge -->
    <g transform="translate(0, 52)">
      <rect width="260" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#22c55e" class="pulse-dot" />
      <text x="32" y="19.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">ENTERPRISE IDENTITY &amp; ACCESS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Multi-Factor Authentication
    </text>

    <!-- Highlight Accent Gradient Subheading -->
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="url(#accentGrad)" letter-spacing="0.5">
      MFA • TOTP • WebAuthn / FIDO2 • Passkeys • Adaptive Zero Trust
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      A curated ecosystem of enterprise SaaS platforms &amp; top-starred open-source authentication engines.
    </text>

    <!-- Feature Pill Tags in Lower Foreground -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="30" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ MFA &amp; 2FA</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(124, 0)">
        <rect width="138" height="30" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔑 FIDO2 / Passkeys</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(274, 0)">
        <rect width="136" height="30" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Adaptive Auth</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(422, 0)">
        <rect width="144" height="30" rx="7" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="19" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Open Source IAM</text>
      </g>
    </g>
  </g>
</svg>
